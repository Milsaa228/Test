# Разовая разведка: официальный API и виджет SoundCloud для soundwave.
name: soundwave api probe

on:
  push:
    paths:
      - '.github/workflows/soundwave-api-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SoundCloud
        shell: python
        run: |
          import re, html, json, urllib.request, urllib.parse, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          def get(url, headers=None):
              req = urllib.request.Request(url, headers={'User-Agent': UA, **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, dict(r.headers), r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read().decode('utf-8', 'replace')
          def text(h):
              h = re.sub(r'(?is)<(script|style|svg)[^>]*>.*?</\1>', ' ', h)
              h = re.sub(r'(?s)<[^>]+>', '\n', h)
              return re.sub(r'\n\s*\n+', '\n', re.sub(r'[ \t]+', ' ', html.unescape(h))).strip()
          def grep(t, kws, width=350):
              for kw in kws:
                  hits = [m.start() for m in re.finditer(kw, t, re.I)][:3]
                  for s in hits:
                      print(f'  [{kw}] …{t[max(0,s-150):s+width]}…'.replace('\n', ' '))
          pages = {
            'guide': 'https://developers.soundcloud.com/docs/api/guide',
            'terms': 'https://developers.soundcloud.com/docs/api/terms-of-use',
            'widget': 'https://developers.soundcloud.com/docs/api/html5-widget',
            'docs': 'https://developers.soundcloud.com/docs',
            'blog': 'https://developers.soundcloud.com/blog',
          }
          for name, url in pages.items():
              st, h, b = get(url)
              t = text(b)
              print(f'\n===== {name} {st} {len(t)} chars')
              print(t[:600].replace('\n', ' | '))
              grep(t, ['register', 'client_id', 'client credentials', 'streams', 'hls', 'progressive', 'aac', 'offline', 'cache', 'download', 'background', 'attribut', 'rate limit', 'monetiz', 'advertis', 'unofficial', 'api-v2', 'scrap', 'form', 'approv', 'widget'])
          # Без ключей
          st, h, b = get('https://api.soundcloud.com/tracks?q=metallica&limit=1')
          print('\nAPI no creds', st, b[:300])
          st, h, b = get('https://soundcloud.com/oembed?format=json&url=' + urllib.parse.quote('https://soundcloud.com/metallica'))
          print('OEMBED', st, b[:500])
          st, h, b = get('https://w.soundcloud.com/player/?url=' + urllib.parse.quote('https://soundcloud.com/metallica'))
          print('WIDGET page', st, len(b))
          st, h, b = get('https://soundcloud.com/you/apps')
          print('APPS page', st, text(b)[:400].replace('\n',' | '))
