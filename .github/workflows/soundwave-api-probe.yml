# Разовая разведка: каталог музыкальных API на apivault.dev.
name: soundwave api probe

on:
  push:
    paths:
      - '.github/workflows/soundwave-api-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: apivault music
        shell: python
        run: |
          import re, html, json, urllib.request
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode('utf-8', 'replace')
          def text(h):
              h = re.sub(r'(?is)<(script|style|svg)[^>]*>.*?</\1>', ' ', h)
              h = re.sub(r'(?s)<[^>]+>', '\n', h)
              return re.sub(r'\n\s*\n+', '\n', re.sub(r'[ \t]+', ' ', html.unescape(h))).strip()
          for page in range(1, 6):
              url = 'https://apivault.dev/categories/Music' + (f'?page={page}' if page > 1 else '')
              try:
                  st, h = get(url)
              except Exception as e:
                  print('ERR', url, e); break
              t = text(h)
              print(f'===== {url} {st} {len(t)} chars')
              print(t[:6000])
              # Встроенные данные Next.js, если есть
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
              if m: print('NEXT_DATA', m.group(1)[:4000])
              links = sorted(set(re.findall(r'href="(/apis?/[^"]+)"', h)))
              print('LINKS', links[:120])
              if page > 1 and str(page) not in t: break
