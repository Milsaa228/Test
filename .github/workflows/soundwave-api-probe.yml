# Разовая разведка: что zaycev.net разрешает сторонним приложениям (соглашение, правообладатели, API).
name: soundwave api probe

on:
  push:
    paths:
      - '.github/workflows/soundwave-api-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch zaycev.net pages
        shell: python
        run: |
          import re, html, urllib.request
          UA = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Language': 'ru'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8', 'replace')
          def text(h):
              h = re.sub(r'(?is)<(script|style|svg)[^>]*>.*?</\1>', ' ', h)
              h = re.sub(r'(?s)<[^>]+>', '\n', h)
              t = html.unescape(h)
              return re.sub(r'\n\s*\n+', '\n', re.sub(r'[ \t]+', ' ', t)).strip()
          try:
              st, url, home = get('https://zaycev.net/')
          except Exception as e:
              print('HOME ERROR', e); raise SystemExit(0)
          print('HOME', st, url, len(home))
          links = sorted(set(re.findall(r'href="(/[^"#?]*(?:agree|rule|term|polic|legal|right|pravo|about|api|partner|dev|widget|licen|pages)[^"#?]*)"', home, re.I)))
          print('FOOTER LINKS', links)
          print('HOME TEXT', text(home)[:1500])
          cand = links + ['/pages/agreement', '/pages/rightholders', '/pages/about', '/agreement', '/rightholders', '/legal']
          seen = set()
          for path in cand:
              if path in seen: continue
              seen.add(path)
              try:
                  st, url, h = get('https://zaycev.net' + path)
                  t = text(h)
                  print(f'\n===== {path} -> {st} {url} ({len(t)} chars)')
                  # Ключевые места соглашения
                  for kw in ['API', 'сторонн', 'программ', 'автоматизир', 'скачив', 'копирова', 'некоммерч', 'личн', 'лиценз', 'правообладател', 'договор', 'воспроизвед', 'реклам', 'парсинг', 'робот']:
                      for m in re.finditer(kw, t, re.I):
                          s = max(0, m.start() - 200); print(f'[{kw}] …{t[s:m.end()+300]}…'.replace('\n', ' '))
                          break
              except Exception as e:
                  print(f'\n===== {path} ERROR {e}')
