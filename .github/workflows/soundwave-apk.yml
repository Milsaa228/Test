# Сборка APK приложения soundwave. Готовый файл прикрепляется к GitHub Release и к артефактам запуска.
name: soundwave APK

on:
  push:
    paths:
      - 'soundwave/**'
      - '.github/workflows/soundwave-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soundwave-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: soundwave
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soundwave/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check types and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: soundwave/android
        # Expo-шаблон подписывает release-сборку debug-ключом — такой APK ставится на телефон напрямую.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        env:
          NODE_ENV: production

      - name: Rename APK
        id: apk
        run: |
          name="soundwave-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=soundwave/$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: soundwave-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soundwave-build-${{ github.run_number }}
          name: Soundwave APK (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            APK музыкального плеера Soundwave для Android (arm64-v8a и armeabi-v7a).
            Скачайте файл ниже и откройте на телефоне. При установке разрешите «Установку из неизвестных источников».
            Коммит: ${{ github.sha }}
