# Разведка Internet Archive для soundwave: сколько свободной (CC/PD) музыки по жанрам и какие исполнители популярны.
name: soundwave archive probe

on:
  push:
    paths:
      - '.github/workflows/soundwave-archive-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query archive.org
        shell: python
        run: |
          import json, urllib.parse, urllib.request, collections
          BASE = 'mediatype:(audio) AND format:(MP3 OR "VBR MP3") AND -collection:(librivoxaudio OR podcasts OR radioprograms OR oldtimeradio)'
          LIC = 'licenseurl:(*creativecommons.org* OR *publicdomain*)'
          def search(q, fields=('identifier','title','creator','licenseurl','subject','downloads'), rows=100, page=1):
              params = [('q', q)] + [('fl[]', f) for f in fields] + [('sort[]', 'downloads desc'), ('rows', rows), ('page', page), ('output', 'json')]
              url = 'https://archive.org/advancedsearch.php?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'soundwave-probe'}), timeout=60) as r:
                  return json.load(r)['response']
          print('license filter total:', search(f'({BASE}) AND {LIC}', rows=1)['numFound'])
          print('no license filter total:', search(BASE, rows=1)['numFound'])
          genres = {
            'jazz': 'subject:(jazz)', 'classical': 'subject:(classical)', 'rock': 'subject:(rock)',
            'electronic': 'subject:(electronic OR electronica)', 'ambient': 'subject:(ambient)', 'hiphop': 'subject:("hip-hop" OR "hip hop" OR hiphop)',
            'blues': 'subject:(blues)', 'lofi': 'subject:(lofi OR "lo-fi")', 'folk': 'subject:(folk)', 'pop': 'subject:(pop)',
            'metal': 'subject:(metal)', 'reggae': 'subject:(reggae)', 'chiptune': 'subject:(chiptune OR 8bit OR "8-bit")',
            'soundtrack': 'subject:(soundtrack OR cinematic)', 'piano': 'subject:(piano)', 'experimental': 'subject:(experimental)',
            'punk': 'subject:(punk)', 'house': 'subject:(house OR techno)', 'acoustic': 'subject:(acoustic)', 'funk': 'subject:(funk OR soul)',
          }
          report = {}
          for name, gq in genres.items():
              try:
                  res = search(f'({gq}) AND ({BASE}) AND {LIC}', rows=100)
              except Exception as e:
                  print(name, 'ERROR', e); continue
              creators = collections.Counter()
              for d in res['docs']:
                  c = d.get('creator')
                  if isinstance(c, list): c = c[0] if c else None
                  if c: creators[c] += 1
              lic = collections.Counter((d.get('licenseurl') or '').split('/licenses/')[-1][:12] for d in res['docs'])
              report[name] = {'found': res['numFound'], 'top_creators': creators.most_common(8), 'licenses': lic.most_common(4),
                              'sample': [d.get('title') for d in res['docs'][:5]]}
              print(name, res['numFound'], creators.most_common(8))
          # Популярные исполнители со свободной музыкой в целом
          creators = collections.Counter()
          for page in (1, 2, 3):
              for d in search(f'({BASE}) AND {LIC}', rows=100, page=page)['docs']:
                  c = d.get('creator')
                  if isinstance(c, list): c = c[0] if c else None
                  if c: creators[c] += 1
          print('TOP CREATORS', creators.most_common(40))
          # Проверка исполнителей-кандидатов
          for a in ['Kevin MacLeod', 'Chris Zabriskie', 'Josh Woodward', 'Jason Shaw', 'Broke For Free', 'Kai Engel', 'Podington Bear', 'Lee Rosevere',
                    'Blue Dot Sessions', 'Komiku', 'Scott Joplin', 'Chopin', 'Bach', 'Mozart', 'Beethoven', 'Erik Satie', 'Tchaikovsky', 'Vivaldi',
                    'Monk Turner', 'Jahzzar', 'Ketsa', 'Dee Yan-Key', 'Loyalty Freak Music', 'Rolemusic', 'Kosta T', 'Lobo Loco', 'Silence Is Sexy',
                    'Nine Inch Nails', 'Jonathan Coulton', 'Grateful Dead', 'Musopen', 'Tours', 'Brad Sucks', 'Revolution Void']:
              try:
                  r = search(f'creator:("{a}") AND ({BASE}) AND {LIC}', rows=3)
                  r2 = search(f'creator:("{a}") AND ({BASE})', rows=1)
                  print('ARTIST', a, 'licensed:', r['numFound'], 'all:', r2['numFound'], [d.get('title') for d in r['docs']])
              except Exception as e:
                  print('ARTIST', a, 'ERROR', e)
          # Пример метаданных одного элемента
          top = search(f'(subject:(jazz)) AND ({BASE}) AND {LIC}', rows=1)['docs'][0]['identifier']
          with urllib.request.urlopen(f'https://archive.org/metadata/{top}', timeout=60) as r:
              m = json.load(r)
          print('META', top, json.dumps(m.get('metadata', {}), ensure_ascii=False)[:800])
          print('FILES', json.dumps([{k: f.get(k) for k in ('name','format','title','creator','length','track','original')} for f in m.get('files', []) if 'mp3' in (f.get('format','')+f.get('name','')).lower()][:6], ensure_ascii=False))
