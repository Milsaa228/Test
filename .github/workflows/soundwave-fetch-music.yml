# Разово скачивает треки Kevin MacLeod (incompetech.com, CC BY 4.0) для встроенного офлайн-каталога soundwave,
# пережимает их в MP3 96 кбит/с и коммитит в soundwave/assets/music вместе с manifest.json.
name: soundwave fetch music

on:
  push:
    paths:
      - '.github/workflows/soundwave-fetch-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download and encode
        run: |
          set -u
          mkdir -p soundwave/assets/music
          cd soundwave/assets/music
          # Название на incompetech | жанр. Берём первые 12 успешно скачанных.
          cat > /tmp/list.txt <<'LIST'
          Local Forecast - Elevator|Лаунж
          Monkeys Spinning Monkeys|Поп
          Bossa Antigua|Джаз
          Itty Bitty 8 Bit|Чиптюн
          Gymnopedie No 1|Классика
          Hyperfun|Электроника
          Galway|Фолк
          Sneaky Snitch|Саундтрек
          Funky Chunk|Фанк
          Night on the Docks - Sax|Джаз
          Volatile Reaction|Рок
          Dreamer|Эмбиент
          Carefree|Поп
          Wallpaper|Электроника
          Airport Lounge|Лаунж
          Cipher|Электроника
          Thatched Villagers|Фолк
          Impact Moderato|Оркестр
          LIST
          echo '[' > manifest.json
          n=0
          while IFS='|' read -r title genre; do
            title="$(echo "$title" | sed 's/^ *//')"
            [ -z "$title" ] && continue
            [ "$n" -ge 12 ] && break
            enc="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$title")"
            url="https://incompetech.com/music/royalty-free/mp3-royaltyfree/${enc}.mp3"
            slug="$(echo "$title" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')"
            if ! curl -fsSL --retry 3 -A 'Mozilla/5.0' -o "/tmp/$slug.mp3" "$url"; then
              echo "::warning::failed $title ($url)"; continue
            fi
            if ! ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/$slug.mp3" >/dev/null 2>&1; then
              echo "::warning::not audio $title"; head -c 300 "/tmp/$slug.mp3"; continue
            fi
            ffmpeg -v error -y -i "/tmp/$slug.mp3" -map_metadata -1 -ac 2 -b:a 96k "$slug.mp3"
            dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$slug.mp3")"
            [ "$n" -gt 0 ] && echo ',' >> manifest.json
            python3 -c 'import json,sys;print(json.dumps({"file":sys.argv[1]+".mp3","title":sys.argv[2],"genre":sys.argv[3],"duration":round(float(sys.argv[4])),"source":sys.argv[5]},ensure_ascii=False))' "$slug" "$title" "$genre" "$dur" "$url" >> manifest.json
            echo "ok $title -> $slug.mp3 ${dur}s $(du -h "$slug.mp3" | cut -f1)"
            n=$((n+1))
          done < /tmp/list.txt
          echo ']' >> manifest.json
          python3 -m json.tool manifest.json > /dev/null
          cat manifest.json
          du -sh .
          [ "$n" -ge 6 ] || { echo "::error::only $n tracks downloaded"; exit 1; }

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soundwave/assets/music
          git commit -m "soundwave: add bundled Kevin MacLeod tracks (CC BY 4.0)" || exit 0
          git push
